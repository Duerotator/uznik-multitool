name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install bandit
      # Preserve all findings; gate medium/high severity with medium/high confidence.
      # Low findings (e.g. subprocess imports and handled exceptions) remain visible.
      - run: python -m bandit -r app scripts -f json -o bandit.json --exit-zero
      - run: python -m bandit -r app scripts -ll -ii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bandit-report
          path: bandit.json
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          extra_args: --results=verified,unknown

  dependencies-and-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'app/ui/finance/package-lock.json'
      - name: Install and build Node wallet codec/UI assets
        run: |
          npm --prefix app/ui/finance ci
          npm --prefix app/ui/finance run build
      - name: Audit Node dependencies
        run: npm --prefix app/ui/finance audit --audit-level=high
      - name: Install application dependencies in isolated environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r config/requirements.txt
          .\.venv\Scripts\python.exe -m pip check
      - name: Offline regression tests (no account credentials)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: .\.venv\Scripts\python.exe tests/run_checks.py fast
      - name: Offscreen Qt desktop smoke check
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: .\.venv\Scripts\python.exe tests/smoke_desktop.py
      - name: Install auditor separately
        if: always()
        run: python -m pip install pip-audit
      - name: Audit actual installed application packages
        if: always()
        continue-on-error: true
        run: python -m pip_audit --path .venv/Lib/site-packages --format json --output pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependency-audit
          path: pip-audit.json
          if-no-files-found: error
          retention-days: 30
