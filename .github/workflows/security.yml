name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install bandit
      # Preserve all findings; gate medium/high severity with medium/high confidence.
      # Low findings (e.g. subprocess imports and handled exceptions) remain visible.
      - run: python -m bandit -r app scripts -f json -o bandit.json --exit-zero
      - run: python -m bandit -r app scripts -ll -ii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bandit-report
          path: bandit.json
          if-no-files-found: error
          retention-days: 30

  dependencies-and-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install application dependencies in isolated environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r config/requirements.txt
          .\.venv\Scripts\python.exe -m pip check
      - name: Offline regression tests (no account credentials)
        run: .\.venv\Scripts\python.exe tests/run_checks.py fast
      - name: Install auditor separately
        if: always()
        run: python -m pip install pip-audit
      - name: Audit actual installed application packages
        if: always()
        run: python -m pip_audit --path .venv/Lib/site-packages --format json --output pip-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dependency-audit
          path: pip-audit.json
          if-no-files-found: error
          retention-days: 30
